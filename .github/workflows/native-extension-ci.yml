name: Native Extension CI

on:
    pull_request:
    push:
        branches:
            - master
    workflow_dispatch:

jobs:
    build-and-test:
        name: Build and test on ${{ matrix.os }} / py${{ matrix.python-version }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - macos-latest
                python-version:
                    - "3.11"

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@v4

            - name: Install native dependencies (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libeigen3-dev libxsimd-dev

            - name: Install native dependencies (macOS)
              if: runner.os == 'macOS'
              run: |
                  brew update
                  brew install eigen xsimd

            - name: Sync Python dependencies
              run: uv sync --dev

            - name: Install build tooling
              run: uv pip install setuptools wheel pybind11

            - name: Build native extensions
              run: uv run python setup.py build_ext --inplace

            - name: Smoke test native imports and warning regression
              run: |
                  uv run python - <<'PY'
                  import contextlib
                  import io

                  err = io.StringIO()
                  with contextlib.redirect_stderr(err):
                      from grad.kernels import cpu_kernel
                      from grad.autograd import operations

                  warning = "Could not import cpu_kernel extension"
                  stderr_text = err.getvalue()
                  if warning in stderr_text:
                      raise RuntimeError(f"Unexpected warning during import: {stderr_text.strip()}")

                  print(cpu_kernel.__name__)
                  print(operations.__name__)
                  PY

            # Runs every file under tests/. PyTorch is not installed yet, so
            # tests/test_torch_parity.py is skipped here and run in its own step below.
            - name: Run Python tests
              run: uv run pytest -q -rs

            - name: Build C++ kernel tests (GoogleTest)
              run: |
                  cmake -S . -B build/ctest \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DPYGRAD_BUILD_KERNEL_TESTS=ON \
                    -DPython3_EXECUTABLE="$(uv run python -c 'import sys; print(sys.executable)')" \
                    -Wno-dev
                  cmake --build build/ctest --parallel

            # The tests embed the base interpreter, which does not see the virtual
            # environment, so point it at the environment's site-packages for numpy.
            - name: Run C++ kernel tests (GoogleTest)
              run: |
                  export PYTHONPATH="$(uv run python -c 'import site; print(site.getsitepackages()[0])')"
                  ctest --test-dir build/ctest --output-on-failure --timeout 120

            - name: Install PyTorch (CPU build) for the parity tests
              run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu

            # Importing torch first makes this step fail, rather than skip, if the
            # install above did not work.
            - name: Compare forward values and gradients against PyTorch
              run: |
                  uv run python -c "import torch; print('torch', torch.__version__)"
                  uv run pytest -q -rxs tests/test_torch_parity.py
